name: transit-probe
on:
  push:
    branches: [transit-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: python3 probe/probe2.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add probe/out
          git commit -m "Resultados de la sonda de horarios [skip ci]" || echo "sin cambios"
          git push
